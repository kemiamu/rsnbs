[package]
name = "rsnbs"
version = "0.1.3"
authors = ["kemiamu <kemya@tuta.io>", "Joppe Stuyck <joppe@stuyck.be>"]
edition = "2024"
description = "A fundamental library for working with the OpenNBS .nbs format"
license = "AGPL-3.0-or-later"
repository = "https://github.com/omninbs/rsnbs"
readme = "README.md"
keywords = ["nbs", "music", "minecraft", "file-format"]
categories = ["games"]

[features]
default = ["cli"]
cli = ["dep:clap", "clap/derive"]

[dependencies]
clap = { version = "4.6.1", optional = true }
counter = "0.7.1"
encoding_rs = "0.8.35"
itertools = "0.15.0"
mcdata = "0.4.0"
rustmatica = "0.5.2"
thiserror = "2.0.18"

[dev-dependencies]
ordered-float = "5.3.0"
